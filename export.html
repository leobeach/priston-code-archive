<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Priston Code — Exportação JSON</title>
</head>
<body>
  <h1>Priston Code — Dados JSON</h1>
  <p id="status">Carregando registros...</p>
  <pre id="output"></pre>

  <script>
    const SUPABASE_URL =
      "https://usczxmaqzmvlyvchvaqv.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_nPQdBxnzrybkDKQbWlbz2w_Rg9xAVCP";

    async function carregarCodigos() {
      const status = document.getElementById("status");
      const output = document.getElementById("output");

      try {
        const url =
          SUPABASE_URL +
          "/rest/v1/codes_priston" +
          "?select=id,name,category,code,created_at,updated_at" +
          "&order=id.asc";

        const resposta = await fetch(url, {
          headers: {
            "apikey": SUPABASE_KEY,
            "Authorization": "Bearer " + SUPABASE_KEY
          }
        });

        if (!resposta.ok) {
          throw new Error("Erro HTTP " + resposta.status);
        }

        const dados = await resposta.json();

        output.textContent = JSON.stringify(dados, null, 2);
        status.textContent =
          "Registros encontrados: " + dados.length;

      } catch (erro) {
        console.error(erro);

        status.textContent =
          "Não foi possível consultar os registros.";

        output.textContent = String(erro.message || erro);
      }
    }

    carregarCodigos();
  </script>
</body>
</html>
