<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080a0c">
  <title>Código-fonte</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      width: 100%;
      background: #080a0c;
      color: #d4dde5;
    }

    body {
      font-family: monospace;
      font-size: 13px;
      line-height: 1.65;
    }

    pre {
      margin: 0;
      padding: 12px;
      min-height: 100vh;
      width: 100%;
      overflow: auto;
      white-space: pre;
      overflow-wrap: normal;
      tab-size: 4;
      -webkit-overflow-scrolling: touch;
      user-select: text;
      -webkit-user-select: text;
    }

    #code {
      font: inherit;
    }
  </style>
</head>

<body>
  <pre><code id="code"></code></pre>

  <script>
    (() => {
      "use strict";

      const SUPABASE_URL =
        "https://usczxmaqzmvlyvchvaqv.supabase.co";

      const SUPABASE_KEY =
        "sb_publishable_nPQdBxnzrybkDKQbWlbz2w_Rg9xAVCP";

      const TABLE = "codes_priston";

      const codeElement = document.getElementById("code");

      async function loadCode() {
        const params = new URLSearchParams(window.location.search);
        const id = params.get("id");

        if (!id) {
          codeElement.textContent = "ID do código não informado.";
          return;
        }

        if (!window.supabase) {
          codeElement.textContent =
            "Não foi possível carregar o visualizador.";
          return;
        }

        try {
          const supabase = window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_KEY
          );

          const { data, error } = await supabase
            .from(TABLE)
            .select("code")
            .eq("id", id)
            .maybeSingle();

          if (error) {
            codeElement.textContent =
              "Erro ao carregar o código: " + error.message;
            return;
          }

          if (!data) {
            codeElement.textContent = "Código não encontrado.";
            return;
          }

          codeElement.textContent = data.code || "";

          document.title = "Código-fonte";

        } catch (error) {
          codeElement.textContent =
            "Erro ao carregar o código.";
        }
      }

      loadCode();
    })();
  </script>
</body>
</html>
